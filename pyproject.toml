[project]
name = "climate-claims"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "numpy",
    "pymupdf",
    "pysbd",
    "python-dotenv",
    "requests",
    "sentence-transformers",
    "uvicorn",
]

[project.scripts]
claims = "climate_claims.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_claims"]